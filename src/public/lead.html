<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма ліда</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="lead.html" class="active">Форма ліда</a>
        <a href="statuses.html">Статуси лідів</a>
    </nav>

    <main class="container">
        <h1>Відправити ліда</h1>

        <form id="leadForm" class="lead-form" method="post" action="/api/index.php">
            <input type="hidden" name="action" value="addlead">
            <div class="form-group">
                <label for="firstName">Ім'я *</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Прізвище *</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button type="submit">Відправити</button>
        </form>

        <div id="formResult" class="result-box" style="display: none;"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
