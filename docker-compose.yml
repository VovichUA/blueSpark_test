services:
  php:
    build:
      context: .docker/php
      dockerfile: Dockerfile
    container_name: bluespark_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: bluespark_nginx
    depends_on:
      - php
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
